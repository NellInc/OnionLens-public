name: Publish reviewed OnionLens release to PyPI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the reviewed release bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dist
          gh release download v0.1.2 --repo NellInc/OnionLens-public --dir dist \
            --pattern 'onionlens-0.1.2-py3-none-any.whl' --pattern 'onionlens-0.1.2.tar.gz'
          printf '%s\n' \
            'bfc4f5c05a81600e3425cea5f09a99edeccbad2991cbff4ded3aac28c3960ace  dist/onionlens-0.1.2-py3-none-any.whl' \
            '964694a18535d4ce510c0af43bc84fd529bf2a235857e998b53465e91bfdb74e  dist/onionlens-0.1.2.tar.gz' | sha256sum --check --strict
      - name: Publish with short-lived PyPI credentials
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          packages-dir: dist/
          attestations: true
